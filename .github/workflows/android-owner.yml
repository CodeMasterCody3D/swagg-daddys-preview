name: Build Android owner app
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign with the original release key and publish a GitHub Release (vX.Y.Z from versionName)'
        type: boolean
        default: false
  push:
    branches: [main, preview/owner-notifications-refresh, preview/owner-github-updates, preview/branded-request-alerts]
    paths: ['android/**', '.github/workflows/android-owner.yml']
permissions:
  contents: read
concurrency:
  group: android-owner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
      SWAGG_CI_TEST_KEYSTORE: /tmp/swagg-owner-ci-test.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK and launcher icon
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python -m pip install --quiet Pillow
          python android/scripts/make-icon.py
          keytool -genkeypair -noprompt -keystore "$SWAGG_CI_TEST_KEYSTORE" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Android Debug'
      - name: Test navigation and build release bundle and APKs
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest bundleRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Validate bundle and generate release test APK
        run: |
          mkdir -p apk-output
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output apk-output/bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  apk-output/bundletool.jar' | sha256sum --check
          cp android/app/build/outputs/bundle/release/app-release.aab apk-output/swagg-daddys-owner-unsigned.aab
          java -jar apk-output/bundletool.jar validate --bundle=apk-output/swagg-daddys-owner-unsigned.aab
          java -jar apk-output/bundletool.jar dump manifest --bundle=apk-output/swagg-daddys-owner-unsigned.aab > apk-output/bundle-manifest.xml
          java -jar apk-output/bundletool.jar build-apks --bundle=apk-output/swagg-daddys-owner-unsigned.aab --output=/tmp/owner-release.apks --mode=universal --ks="$SWAGG_CI_TEST_KEYSTORE" --ks-key-alias=androiddebugkey --ks-pass=pass:android --key-pass=pass:android
          python -c "import zipfile; zipfile.ZipFile('/tmp/owner-release.apks').extract('universal.apk', '/tmp/owner-release')"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 smoke tests against bundle-generated release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r /tmp/owner-release/universal.apk
            adb install -r -t android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.swaggdaddysmobile.test/androidx.test.runner.AndroidJUnitRunner > apk-output/device-tests.txt
            cat apk-output/device-tests.txt
            python -c "from pathlib import Path; result = Path('apk-output/device-tests.txt').read_text(); assert 'OK (9 tests)' in result and 'FAILURES!!!' not in result, result"
            adb pull /sdcard/Android/data/com.swaggdaddysmobile/files/notification-preview.png apk-output/notification-preview.png
      - name: Package unsigned release and signing verifier
        if: success()
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/swagg-daddys-owner-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apk-output/apksigner.jar
          sha256sum apk-output/*.apk apk-output/*.aab apk-output/*.jar > apk-output/SHA256SUMS.txt
      - name: Upload build and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagg-daddys-android-build
          path: |
            apk-output/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: error
          retention-days: 30

  # Signs the tested APK with the original key (GitHub secrets SWAGG_RELEASE_KEYSTORE_B64
  # and SWAGG_RELEASE_KEY_PASSWORD) and publishes it as a GitHub Release, which the owner
  # app's Updates list reads. Runs only on a manual "publish" run, and only after every
  # build, unit and emulator check above has passed.
  release:
    needs: android
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: swagg-daddys-android-build
          path: build
      - name: Sign with the original release key and verify the certificate
        env:
          KEYSTORE_B64: ${{ secrets.SWAGG_RELEASE_KEYSTORE_B64 }}
          SWAGG_SIGNING_PASSWORD: ${{ secrets.SWAGG_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SWAGG_SIGNING_PASSWORD" ]; then echo "::error::Release signing secrets are not set"; exit 1; fi
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unreadable versionName"; exit 1; }
          umask 077; KS="$RUNNER_TEMP/owner.p12"; printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          OUT="Swagg-Daddys-Owner-$VERSION.apk"
          java -jar build/apk-output/apksigner.jar sign --ks "$KS" --ks-type PKCS12 --ks-key-alias swagg-owner \
            --ks-pass env:SWAGG_SIGNING_PASSWORD --key-pass env:SWAGG_SIGNING_PASSWORD --out "$OUT" build/apk-output/swagg-daddys-owner-unsigned.apk
          rm -f "$KS"
          CERT=$(java -jar build/apk-output/apksigner.jar verify --print-certs "$OUT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$CERT" != "e2d43b648a01ed91ab3483d7dbf8b8ef1bdcd03ff812be2d5d22ffc1ae49db1e" ]; then echo "::error::Signed with the wrong certificate ($CERT)"; exit 1; fi
          java -jar build/apk-output/apksigner.jar verify --verbose "$OUT" | grep -E "Verified using v[0-9] scheme"
          sha256sum "$OUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"; echo "APK=$OUT" >> "$GITHUB_ENV"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "::error::v$VERSION is already published; raise versionName/versionCode first"; exit 1; fi
          NOTES=android/release-notes/$VERSION.md
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "v$VERSION" "$APK" --target "$GITHUB_SHA" --title "Swagg Daddy's Owner $VERSION" --notes-file "$NOTES" --latest
          gh release view "v$VERSION" --json assets --jq '.assets[] | "\(.name) \(.size) \(.digest)"'

