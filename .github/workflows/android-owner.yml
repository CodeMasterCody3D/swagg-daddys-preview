name: Build Android owner app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-owner.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare SDK and launcher icon
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python -m pip install --quiet Pillow
          python android/scripts/make-icon.py
      - name: Test navigation and assemble APKs
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 device smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            gradle --no-daemon connectedDebugAndroidTest
            adb shell am start -n com.swaggdaddys.owner/.MainActivity
            sleep 4
            mkdir -p ../apk-output
            adb shell screencap -p /sdcard/owner-login.png
            adb pull /sdcard/owner-login.png ../apk-output/owner-login.png
      - name: Package unsigned release and signing verifier
        if: success()
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/swagg-daddys-owner-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apk-output/apksigner.jar
          sha256sum apk-output/*.apk apk-output/apksigner.jar > apk-output/SHA256SUMS.txt
      - name: Upload build and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swagg-daddys-android-build
          path: |
            apk-output/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: error
          retention-days: 30
