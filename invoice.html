<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">

<title>Invoice · Swagg Daddys Mobile Mechanics</title>
<link rel="icon" href="assets/swagg-daddys-logo-transparent.webp">
<link rel="stylesheet" href="invoice.css">
<style>
body{margin:0;background:#0b120f;font-family:Arial,Helvetica,sans-serif;color:#f0f3ed}
.bar{max-width:820px;margin:0 auto;padding:18px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar a{color:#47edbd;font-size:13px;text-decoration:none}
.bar button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #47edbd;background:#47edbd;color:#06251a;font-weight:800;font-size:14px;cursor:pointer}
#invoice{padding:0 16px 40px}
.message{max-width:560px;margin:60px auto;text-align:center;line-height:1.6}
@media print{.bar{display:none}#invoice{padding:0}}
</style>
</head>
<body>
<div class="bar"><a href="/">Swagg Daddys Mobile Mechanics</a><button type="button" id="print" hidden>Print or save PDF</button></div>
<main id="invoice"><p class="message">Loading your invoice…</p></main>
<script type="module" src="invoice-view.js"></script>
