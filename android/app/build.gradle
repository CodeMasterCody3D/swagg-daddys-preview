plugins { id 'com.android.application' }

android {
    namespace 'com.swaggdaddys.owner'
    compileSdk 36
    buildToolsVersion '36.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.swaggdaddysmobile'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        debug {
            // A disposable CI key also signs the bundle-derived APK for instrumentation.
            def ciKey = System.getenv('SWAGG_CI_TEST_KEYSTORE')
            if (ciKey) {
                storeFile file(ciKey)
                storeType 'PKCS12'
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
